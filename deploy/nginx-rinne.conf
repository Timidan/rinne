# Rinne nginx reverse proxy.
# Install: sudo cp deploy/nginx-rinne.conf /etc/nginx/sites-available/rinne
#          sudo ln -s /etc/nginx/sites-available/rinne /etc/nginx/sites-enabled/
#          edit server_name, then: sudo certbot --nginx -d rinne.example.com
#          sudo nginx -t && sudo systemctl reload nginx
# Replace rinne.example.com everywhere with your domain.

server {
    listen 80;
    listen [::]:80;
    server_name rinne.example.com;

    # certbot serves its ACME challenge from here; redirect all else to https.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rinne.example.com;

    # `certbot --nginx` fills these in automatically; shown here for clarity.
    ssl_certificate     /etc/letsencrypt/live/rinne.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rinne.example.com/privkey.pem;

    # Guard requests are small JSON bodies; cap to reject oversized payloads.
    client_max_body_size 256k;

    # Security headers (TLS is terminated here, so HSTS is safe).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The dashboard is never meant to be framed; block clickjacking.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:4517;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Critical: lets /skill.md emit https:// curl URLs and keeps same-origin
        # CORS working. Without it, the served skill would show http:// links.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
