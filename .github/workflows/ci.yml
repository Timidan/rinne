name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the dashboard
        run: pnpm --filter rinne-web build

      - name: Build the guard engine
        run: pnpm --filter rinne build

      - name: Run the guard test suite
        run: node --test rinne/dist/test/*.test.js
